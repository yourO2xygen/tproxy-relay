name: tproxy-local

services:
  nginx:
    build: deploy/nginx
    container_name: tproxy-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      relay:
        condition: service_healthy
    networks: [front]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  relay:
    build:
      context: .
      dockerfile: deploy/relay/Dockerfile
    container_name: tproxy-relay
    environment:
      TPROXY_PUBLIC_HOSTNAME: proxy.example.com
      TPROXY_SECRET_HEX: "000102030405060708090a0b0c0d0e0f"
      TPROXY_BACKEND_HOST: backend-stub:9000
      TPROXY_CARRIER_MODE: https
      TPROXY_BASE_PATH: ${TPROXY_BASE_PATH:-}
      TPROXY_PUBLIC_DIR: ${TPROXY_PUBLIC_DIR:-}
      TPROXY_PUBLIC_UPSTREAM: ${TPROXY_PUBLIC_UPSTREAM:-}
      TPROXY_STATIC_ROUTES: ${TPROXY_STATIC_ROUTES:-}
      TPROXY_TOKEN_KEY_PATH: /data/token.key
      TPROXY_KEYS_DB: /data/keys.db
      # SEC-001: контейнер слушает admin на всех интерфейцах только потому,
      # что порт публикуется на loopback хоста (ports ниже).
      TPROXY_ADMIN_LISTEN: 0.0.0.0:8081
      TPROXY_API_ENABLED: ${TPROXY_API_ENABLED:-false}
      TPROXY_API_TOKEN: ${TPROXY_API_TOKEN:-}
      TPROXY_BOT_ENABLED: ${TPROXY_BOT_ENABLED:-false}
      TPROXY_BOT_TOKEN: ${TPROXY_BOT_TOKEN:-}
      TPROXY_BOT_ADMINS: ${TPROXY_BOT_ADMINS:-}
      DOTNET_GCHeapHardLimitPercent: "75"
    volumes:
      - relay-data:/data
    ports:
      - "127.0.0.1:8081:8081"   # admin endpoints on host loopback only
    networks: [front, back]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  backend-stub:
    image: python:3.12-alpine
    container_name: tproxy-backend
    command: python /app/echo_server.py 9000
    volumes:
      - ./deploy/backend-stub/echo_server.py:/app/echo_server.py:ro
    networks: [back]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Real official MTProxy, pinned commit f36d8af769ffaeac36978d38c2c0f6d1104c2137.
  # Enable with: docker compose --profile mtproxy up -d
  # Then set relay TPROXY_BACKEND_HOST=mtproxy:2398 and restart the relay.
  # NOTE: behind docker NAT set MTPROXY_NAT_ARGS="--nat-info <container-ip>:<public-ip>",
  # or use network_mode: host instead (plus a firewall rule for 2398).
  mtproxy:
    build: deploy/mtproxy
    container_name: tproxy-mtproxy
    profiles: [mtproxy]
    environment:
      MTPROXY_SECRET: "000102030405060708090a0b0c0d0e0f"
      MTPROXY_NAT_ARGS: ""
    cap_add: [NET_BIND_SERVICE]
    networks: [front, back]   # needs egress to Telegram DCs (back is internal-only)
    restart: unless-stopped

volumes:
  relay-data:

networks:
  front:
  back:
    internal: true
