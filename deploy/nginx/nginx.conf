worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    # The bridge URL and carrier bearer must never be logged.
    access_log off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        # PERF-007: empty value drops the Connection header for non-WS
        # requests, enabling upstream keepalive instead of TCP churn.
        ''      '';
    }

    # PERF-007: keepalive pool for the non-WS traffic (long polls, /up, public).
    upstream relay_backend {
        server relay:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name proxy.example.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name proxy.example.com;

        ssl_certificate     /etc/nginx/certs/proxy.example.com.crt;
        ssl_certificate_key /etc/nginx/certs/proxy.example.com.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Every path goes to the relay: no separate probeable transport surface.
        location / {
            proxy_pass http://relay_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            client_max_body_size 4m;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
        }
    }
}
