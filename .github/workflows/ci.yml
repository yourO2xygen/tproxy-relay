name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build src/TproxyRelay -c Release

      - name: Unit tests
        run: dotnet test tests/TproxyRelay.Tests -c Release

      - name: Docker image builds
        run: |
          docker build -t tproxy-relay:ci -f deploy/relay/Dockerfile .
