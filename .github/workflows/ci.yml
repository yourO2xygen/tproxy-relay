name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

# DEP-003: минимальные права GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      # DEP-002/SEC-008: actions pinned by commit SHA.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build src/TproxyRelay -c Release

      - name: Unit tests
        run: dotnet test tests/TproxyRelay.Tests -c Release

      - name: Docker image builds
        run: |
          docker build -t tproxy-relay:ci -f deploy/relay/Dockerfile .
