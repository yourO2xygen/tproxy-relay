name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

# DEP-003: минимальные права GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      # DEP-002/SEC-008: actions pinned by commit SHA.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-

      - name: Restore (locked)
        run: |
          dotnet restore --locked-mode src/TproxyRelay
          dotnet restore --locked-mode tests/TproxyRelay.Tests

      - name: Build
        run: dotnet build src/TproxyRelay -c Release --no-restore

      - name: Unit + integration tests
        run: >
          dotnet test tests/TproxyRelay.Tests -c Release --no-restore
          --blame-hang-timeout 10m
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage
          retention-days: 7

      - name: Docker image builds (all)
        run: |
          docker build -t tproxy-relay:ci -f deploy/relay/Dockerfile .
          docker build -t tproxy-nginx:ci deploy/nginx
          docker build -t tproxy-mtproxy:ci deploy/mtproxy
