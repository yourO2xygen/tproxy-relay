# Прод-конфигурация: C#-релей + MTProxy в контейнерах за хостовым nginx.
# nginx ставится отдельно (см. deploy/production/nginx-vhost.conf.example).
#
# Использование:
#   cp deploy/production/.env.example .env   # или: deploy/production/setup.sh <домен>
#   docker compose -f docker-compose.prod.yml up -d
services:
  relay:
    image: tproxy-relay:latest
    build:
      context: .
      dockerfile: deploy/relay/Dockerfile
    container_name: tproxy-relay
    user: "10001:10001"
    environment:
      TPROXY_PUBLIC_HOSTNAME: ${TPROXY_PUBLIC_HOSTNAME}
      # Секрет: либо TPROXY_SECRET_HEX, либо файл TPROXY_SECRET_HEX_FILE
      # (docker secrets); релей откажется стартовать без секрета.
      TPROXY_SECRET_HEX: ${TPROXY_SECRET_HEX:-}
      TPROXY_SECRET_HEX_FILE: ${TPROXY_SECRET_HEX_FILE:-}
      TPROXY_BACKEND_HOST: mtproxy:2398
      TPROXY_CARRIER_MODE: ${TPROXY_CARRIER_MODE:-https}
      # Пусто = прокси в корне хоста; со слагом все пути переезжают под /<base>/
      # иcapability выводится из host+path (ссылка использует маркированный секрет).
      TPROXY_BASE_PATH: ${TPROXY_BASE_PATH:-}
      TPROXY_TOKEN_KEY_PATH: /data/token.key
      TPROXY_KEYS_DB: /data/keys.db
      TPROXY_API_ENABLED: ${TPROXY_API_ENABLED:-false}
      TPROXY_API_TOKEN: ${TPROXY_API_TOKEN:-}
      TPROXY_BOT_ENABLED: ${TPROXY_BOT_ENABLED:-false}
      TPROXY_BOT_TOKEN: ${TPROXY_BOT_TOKEN:-}
      TPROXY_BOT_ADMINS: ${TPROXY_BOT_ADMINS:-}
    volumes:
      - relay-data:/data
    networks:
      - tproxy-net
    ports:
      - "127.0.0.1:8080:8080"   # сюда проксирует хостовый nginx
      - "127.0.0.1:8081:8081"   # admin: healthz/readyz/metrics, только loopback
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12

  mtproxy:
    image: tproxy-mtproxy:latest
    build:
      context: deploy/mtproxy
    container_name: tproxy-mtproxy
    environment:
      MTPROXY_SECRET: ${TPROXY_SECRET_HEX:?err}
      KEYS_FILE: /keys/registry.txt
      # За docker-NAT middle-end должен представляться публичным адресом.
      # IP фиксирован в сети ниже (172.20.0.2), меняется только публичная часть.
      MTPROXY_NAT_ARGS: --nat-info ${MTPROXY_LOCAL_IP:-172.20.0.2}:${MTPROXY_PUBLIC_IP:?err}
    volumes:
      - relay-data:/keys:ro   # registry.txt written by the relay supervisor-side
    networks:
      tproxy-net:
        ipv4_address: 172.20.0.2
    read_only: true
    tmpfs:
      - /tmp
    # mtproto-proxy drops to 'nobody' itself: it needs SETGID/SETUID to
    # surrender privileges; everything else is dropped.
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/2398 && echo ok || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 5
    # порты наружу не публикуются: доступен только релею внутри сети

networks:
  tproxy-net:
    name: tproxy-net
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  relay-data:
